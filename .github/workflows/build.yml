name: Maven CI

on:
  push:
    branches:
      - master
    paths:
      - "**.cpp"
      - "**.h"
      - "**.java"

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-14, ubuntu-20.04, windows-2022]
        java: [13]

    env:
      WEBRTC_CACHE_BRANCH: 4844
      WEBRTC_CHECKOUT_FOLDER: webrtc
      WEBRTC_INSTALL_FOLDER: webrtc/build

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Linux audio system
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio libpulse-dev libasound2-dev libudev-dev libv4l-dev
          # Required for testing
          pulseaudio --start

      - name: Set up WebRTC cache
        uses: actions/cache@v4
        with:
          path: ~/${{ env.WEBRTC_INSTALL_FOLDER }}
          key: webrtc-${{ env.WEBRTC_CACHE_BRANCH }}-${{ runner.os }}-${{ hashFiles('webrtc-jni/pom.xml') }}
          restore-keys: webrtc-${{ env.WEBRTC_CACHE_BRANCH }}-${{ runner.os }}-

      - name: Set up Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}
          server-id: ossrh
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD
          settings-path: ${{ github.workspace }}/.github/workflows

      - name: Build
        run: mvn package -DskipTests -s .github/workflows/settings.xml

      - name: Test
        run: mvn -B jar:jar surefire:test
      - name: Show current Dir
        run: ls ./webrtc/target && ls ./webrtc-jni/target
        shell: bash

      - name: Archive Artifact 1
        uses: actions/upload-artifact@v4
        with:
          name: webrtc_jni_${{ runner.os }}
          path: ./webrtc-jni/target/*.jar
          overwrite: true

      - name: Archive Artifact 1
        uses: actions/upload-artifact@v4
        with:
          name: webrtc_java
          path: ./webrtc/target/*.jar
          overwrite: true

      - name: Create Artifacts Dir
        run: mkdir artifacts
        shell: bash

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: webrtc_jni_${{ runner.os }}
          path: artifacts

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: webrtc_java
          path: artifacts

      - name: List Artifacts
        run: ls artifacts
        shell: bash
#      - name: Deploy
#        env:
#          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
#          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
#        run: mvn deploy -DskipTests -s .github/workflows/settings.xml